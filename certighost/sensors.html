let currentTab = 'conn';
let searchVal = '';
let srcFilter = '';
let dstFilter = '';

function ts2str(ts) {
  if (!ts || ts === '-') return ts;
  const d = new Date(parseFloat(ts) * 1000);
  return d.toISOString().replace('T',' ').replace('Z','').slice(0,22);
}

function colorCell(field, val) {
  if (val === '-' || val === '') return `<span style="color:#444">-</span>`;
  if (field === 'ts') return `<span class="ts">${ts2str(val)}</span>`;
  if ((field === 'id.orig_h' || field === 'id.resp_h') && val === '172.16.14.50') {
    return `<span class="tag-attacker">${val}</span>`;
  }
  if (field === 'success') {
    if (val === 'T') return `<span class="tag-success">T</span>`;
    if (val === 'F') return `<span class="tag-fail">F</span>`;
    return `<span style="color:#444">-</span>`;
  }
  if (field === 'conn_state') {
    const color = val === 'SF' ? '#27ae60' : val.startsWith('RST') ? '#c0392b' : '#888';
    return `<span style="color:${color}">${val}</span>`;
  }
  return val;
}

function isChase(row) {
  return row['id.orig_h'] === '172.16.14.10' && row['id.resp_h'] === '172.16.14.50';
}

function matchesFilters(row, fields) {
  if (srcFilter) {
    const srcFields = ['id.orig_h'];
    if (!srcFields.some(f => row[f] === srcFilter)) return false;
  }
  if (dstFilter) {
    const dstFields = ['id.resp_h'];
    if (!dstFields.some(f => row[f] === dstFilter)) return false;
  }
  if (searchVal) {
    const s = searchVal.toLowerCase();
    return fields.some(f => (row[f]||'').toLowerCase().includes(s));
  }
  return true;
}

function renderTable(tab) {
  const log = DATA[tab];
  const dispFields = DISPLAY[tab];
  const rows = log.rows;
  const filtered = rows.filter(r => matchesFilters(r, log.fields));

  document.getElementById('result-count').textContent =
    `${filtered.length} of ${rows.length} records`;

  const noRes = document.getElementById('no-results');
  const container = document.getElementById('table-container');

  if (filtered.length === 0) {
    container.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  let html = '<table><thead><tr>';
  dispFields.forEach(f => {
    html += `<th title="${f}">${f}</th>`;
  });
  html += '</tr></thead><tbody>';

  filtered.forEach(row => {
    const chase = isChase(row);
    html += `<tr class="${chase ? 'highlight' : ''}">`;
    dispFields.forEach(f => {
      const val = row[f] || '-';
      html += `<td title="${val}">${colorCell(f, val)}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;

  // update tab counts
  document.querySelectorAll('.tab').forEach(t => {
    const name = t.dataset.tab;
    const total = DATA[name].rows.length;
    const fRows = DATA[name].rows.filter(r => matchesFilters(r, DATA[name].fields));
    t.querySelector('.count').textContent = `(${fRows.length}/${total})`;
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderTable(tab);
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value.trim();
  renderTable(currentTab);
});

document.getElementById('src-filter').addEventListener('change', e => {
  srcFilter = e.target.value;
  renderTable(currentTab);
});

document.getElementById('dst-filter').addEventListener('change', e => {
  dstFilter = e.target.value;
  renderTable(currentTab);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  searchVal = '';
  srcFilter = '';
  dstFilter = '';
  document.getElementById('search').value = '';
  document.getElementById('src-filter').value = '';
  document.getElementById('dst-filter').value = '';
  renderTable(currentTab);
});

// init
switchTab('conn');
</script>
</body>
</html>
